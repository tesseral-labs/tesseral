metadata:
  name: tesseral
  labels:
    name: tesseral
---
apiVersion: v1
kind: PersistentVolume
metadata:
  namespace: tesseral
  name: tesseraldb
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 2Gi
  hostPath:
    path: /data/tesseraldb
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: tesseral
  name: tesseraldb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: tesseraldb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: tesseral
  name: tesseraldb
  labels:
    app: tesseraldb
    role: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tesseraldb
      role: service
  serviceName: tesseraldb
  template:
    metadata:
      labels:
        app: tesseraldb
        role: service
    spec:
      containers:
        - name: postgres
          image: postgres:15.8
          env:
            - name: POSTGRES_PASSWORD
              value: password
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          volumeMounts:
            - name: tesseraldb
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: tesseraldb
          persistentVolumeClaim:
            claimName: tesseraldb
---
apiVersion: v1
kind: Service
metadata:
  namespace: tesseral
  name: tesseraldb
