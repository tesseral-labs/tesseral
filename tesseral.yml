  TESSERAL_INTERNAL_API_MICROSOFT_OAUTH_CLIENT_SECRETS_KMS_BACKEND: "dangerously_store_plaintext_private_keys"
  TESSERAL_INTERNAL_API_GITHUB_OAUTH_CLIENT_SECRETS_KMS_BACKEND: "dangerously_store_plaintext_private_keys"
