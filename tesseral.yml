---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: tesseral
  name: tesseral-internal-api
  labels:
    app: tesseral-internal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tesseral-internal-api
  template:
    metadata:
      labels:
        app: tesseral-internal-api
    spec:
      containers:
        - name: tesseral-internal-api
          image: ghcr.io/tesseral-labs/unstable-tesseral-internal-api:sha-52b9d08
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: tesseral-internal-api
---
apiVersion: v1
kind: Service
metadata:
  namespace: tesseral
  name: tesseral-internal-api
spec:
  selector:
    app: tesseral-internal-api
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
